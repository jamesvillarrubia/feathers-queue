openapi: 3.0.0
info:
  title: Feathers Task Queue API
  version: 1.0.0
  description: API for managing cloud-agnostic task queues with support for GCP, AWS, and Azure

servers:
  - url: http://localhost:3030
    description: Local development server

components:
  schemas:
    Task:
      type: object
      required:
        - type
        - data
      properties:
        type:
          type: string
          description: Type of task to be processed
        data:
          type: object
          description: Task-specific data
        options:
          type: object
          properties:
            priority:
              type: integer
              minimum: 1
              maximum: 10
              default: 5
            scheduledFor:
              type: integer
              format: int64
              description: Unix timestamp for scheduled processing
            maxRetries:
              type: integer
              minimum: 0
              default: 3
            retryDelay:
              type: integer
              minimum: 0
              default: 1000
              description: Delay in milliseconds between retries
            queueName:
              type: string
              description: Name of the queue to use (defaults to 'default')
            exactlyOnce:
              type: boolean
              default: false
              description: Whether to ensure exactly-once processing

    TaskResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        data:
          type: object
        options:
          $ref: '#/components/schemas/Task/properties/options'
        status:
          type: string
          enum: [pending, processing, completed, failed]
        processingHistory:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: integer
                format: int64
              status:
                type: string
              error:
                type: object
                properties:
                  message:
                    type: string
                  code:
                    type: string

paths:
  /tasks:
    post:
      summary: Create a new task
      description: Creates and enqueues a new task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  message:
                    type: string
                  code:
                    type: integer
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  message:
                    type: string
                  code:
                    type: integer

    get:
      summary: List tasks
      description: Retrieves a list of tasks with optional filtering
      operationId: findTasks
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, failed]
        - name: type
          in: query
          schema:
            type: string
        - name: queueName
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  limit:
                    type: integer
                  skip:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskResponse'

  /tasks/{id}:
    get:
      summary: Get a task
      description: Retrieves a specific task by ID
      operationId: getTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  message:
                    type: string
                  code:
                    type: integer 