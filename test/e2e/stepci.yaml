name: Task Queue Service Tests
version: 1.0.0

env:
  baseUrl: http://localhost:3030
  debug: true

tests:
  task-queue-service:
    steps:
      - name: Create Basic Task
        http:
          url: ${{env.baseUrl}}/tasks
          method: POST
          headers:
            Content-Type: application/json
          json:
            type: "test-task"
            data:
              test: "data"
            options:
              priority: 5
              queueName: "basic-test-queue"
        expect:
          status: 201
          json:
            id: "!string"
            type: "test-task"
            data:
              test: "data"
            options:
              priority: 5
              queueName: "basic-test-queue"
            status: "pending"
            processingHistory: []

      - name: Create High Priority Task
        http:
          url: ${{env.baseUrl}}/tasks
          method: POST
          headers:
            Content-Type: application/json
          json:
            type: "priority-task"
            data:
              priority: "high"
            options:
              priority: 1
              queueName: "priority-test-queue"
        expect:
          status: 201
          json:
            id: "!string"
            type: "priority-task"
            data:
              priority: "high"
            options:
              priority: 1
              queueName: "priority-test-queue"
            status: "pending"
            processingHistory: []

      - name: Create Scheduled Task
        http:
          url: ${{env.baseUrl}}/tasks
          method: POST
          headers:
            Content-Type: application/json
          json:
            type: "scheduled-task"
            data:
              scheduled: true
            options:
              priority: 5
              queueName: "scheduled-test-queue"
              scheduledFor: "{{add timestamp 5000}}"
        expect:
          status: 201
          json:
            id: "!string"
            type: "scheduled-task"
            data:
              scheduled: true
            options:
              priority: 5
              queueName: "scheduled-test-queue"
              scheduledFor: "!number"
            status: "pending"
            processingHistory: []

      - name: Create Exactly-Once Task
        http:
          url: ${{env.baseUrl}}/tasks
          method: POST
          headers:
            Content-Type: application/json
          json:
            type: "exactly-once-task"
            data:
              idempotent: true
            options:
              exactlyOnce: true
              queueName: "exactly-once-queue"
        expect:
          status: 201
          json:
            id: "!string"
            type: "exactly-once-task"
            data:
              idempotent: true
            options:
              exactlyOnce: true
              queueName: "exactly-once-queue"
            status: "pending"
            processingHistory: []

      - name: List Tasks
        http:
          url: ${{env.baseUrl}}/tasks
          method: GET
          headers:
            Content-Type: application/json
        expect:
          status: 200
          json:
            total: "!number"
            limit: "!number"
            skip: "!number"
            data: "!array"

      - name: Get Task by ID
        http:
          url: ${{env.baseUrl}}/tasks/{{steps[0].response.json.id}}
          method: GET
          headers:
            Content-Type: application/json
        expect:
          status: 200
          json:
            id: "{{steps[0].response.json.id}}"
            type: "test-task"
            data:
              test: "data"
            options:
              priority: 5
              queueName: "basic-test-queue"
            status: "!string"
            processingHistory: "!array" 